# final_ws_curvature_signal.launch 전용. 조향/속도는 launch 또는 highway-test.env에서 설정.
# MORAI 신호등 카메라(UDP 1131)의 실제 보정값을 입력한다.
# 차선 카메라(1101)의 cam_set.json 값을 그대로 복사하면 안 된다.
# calibrated=true만 바꾸면 안 된다. 실제 영상과 지도 신호등 투영이 맞아야 한다.
signal_camera:
  calibrated: false
  width: 0
  height: 0
  horizontal_fov_deg: 0.0
  x: 0.0
  y: 0.0
  z: 0.0
  pitch_deg: 0.0  # 이 코드에서는 위를 향하면 양수. MORAI 표기와 축을 확인한다.
  yaw_deg: 0.0    # 차량 전방 x / 좌측 y / 위쪽 z, 좌향 양수. 카메라 roll=0 가정.

input_timeout_sec: 0.5
signal_timeout_sec: 0.8
max_route_error_m: 3.0
stop_tolerance_m: 0.03
accel_rise_rate_per_sec: 0.5
turn_max_heading_error_deg: 60.0
turn_max_lateral_error_m: 1.5
turn_exit_heading_error_deg: 15.0
turn_exit_lateral_error_m: 0.75
turn_exit_overrun_m: 3.0
